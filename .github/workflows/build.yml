name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - readme
    paths:
      - .github/workflows/build.yml

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: hzyitc/u-boot-onecloud
  UBOOT_TAG: build-20221028-0940
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main
  PATCHES: 4077,5076

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.get.outputs.env }}
    steps:
      - id: get
        name: Get repositories information
        run: |
          TIME="$(curl https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID} | jq -r .created_at)"
          TAG="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"
          SCRIPT_SHA=$(curl https://api.github.com/repos/${SCRIPT_REPO}/commits/${SCRIPT_REF} | jq -r .sha)
          ARMBIAN_SHA=$(curl https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF} | jq -r .sha)
          cat <<EOF | sed -E 's/^  //' >>$GITHUB_ENV
            TIME=$TIME
            TAG=$TAG
            SCRIPT_SHA=$SCRIPT_SHA
            ARMBIAN_SHA=$ARMBIAN_SHA
          EOF
          echo "env=$(cat $GITHUB_ENV | base64 -w 0)" >>$GITHUB_OUTPUT

      - name: Show repositories information
        run: |
          echo -e "Time: $(date -d "$TIME" +'%Y-%m-%d %H:%M:%S %Z')"
          echo "Script: ${SCRIPT_REPO}@${SCRIPT_REF}"
          echo "U-Boot: ${UBOOT_REPO}@${UBOOT_TAG}"
          echo "Armbian: ${ARMBIAN_REPO}@${ARMBIAN_REF}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TAG }}
          draft: true

  build:
    name: Build ${{ matrix.RELEASE }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        RELEASE:
          - trixie
          - resolute
    steps:
      - name: Import env
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV

      - name: Checkout armbian/build
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Apply patches
        if: env.PATCHES != ''
        run: |
          curl -L -O "https://github.com/armbian/build/pull/{${PATCHES}}.patch"
          for file in *.patch; do
            patch --batch -p1 -N <"$file"
          done

      - name: Install dependencies and set up binfmt
        run: |
          # Restore binfmt-support (may have been removed by previous run's broken install)
          sudo apt-get update
          sudo apt-get install -y --reinstall binfmt-support || true
          # Install qemu-user-static for cross-architecture builds
          sudo apt-get install -y qemu-user-static || true
          # Ensure binfmt_misc is loaded and mounted
          sudo modprobe binfmt_misc 2>/dev/null || true
          sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
          # Create /usr/share/binfmts/qemu-* descriptor files for all needed architectures
          # These are needed so Armbian's check "e /usr/share/binfmts/qemu-${arch}" passes
          for arch in arm aarch64 x86_64 riscv64 loongarch64; do
            if [ ! -f "/usr/share/binfmts/qemu-${arch}" ]; then
              cat > "/usr/share/binfmts/qemu-${arch}" <<DESCRIPTOR
          package qemu-user-static
          interpreter /usr/bin/qemu-${arch}-static
          magic \x7f\x45\x4c\x46
          offset 0
          mask \xff\xff\xff\xff\x00\x00\x00\x00\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff
          credentials yes
          fix_binary no
          preserve yes
          DESCRIPTOR
              # Enable it if update-binfmts is available
              if command -v update-binfmts &>/dev/null; then
                sudo update-binfmts --import "qemu-${arch}" 2>/dev/null || true
                sudo update-binfmts --enable "qemu-${arch}" 2>/dev/null || true
              fi
            fi
          done
          # Create arch-test wrapper that properly maps arch names to binfmt entries
          sudo tee /usr/local/bin/arch-test > /dev/null <<'WRAPPER'
          #!/bin/bash
          # arch-test wrapper: map arch names to binfmt_misc entries and check support
          declare -A binfmt_names=(
            [arm]=qemu-arm [armhf]=qemu-arm [arm32]=qemu-arm
            [arm64]=qemu-aarch64 [aarch64]=qemu-aarch64
            [amd64]=qemu-x86_64 [x86_64]=qemu-x86_64
            [riscv64]=qemu-riscv64 [riscv]=qemu-riscv64
            [loongarch64]=qemu-loongarch64 [loongarch]=qemu-loongarch64
          )
          exit_code=0
          for arg in "$@"; do
            name="${binfmt_names[$arg]:-qemu-$arg}"
            if [ -e "/proc/sys/fs/binfmt_misc/${name}" ] && grep -q "enabled" "/proc/sys/fs/binfmt_misc/${name}" 2>/dev/null; then
              echo "${arg}: supported"
            else
              echo "${arg}: not supported" >&2
              exit_code=1
            fi
          done
          exit $exit_code
          WRAPPER
          sudo chmod +x /usr/local/bin/arch-test

      - name: Verify binfmt support
        run: |
          echo "=== update-binfmts ===" && which update-binfmts 2>/dev/null && update-binfmts --list 2>/dev/null || echo "update-binfmts not found"
          echo "=== arch-test ===" && which arch-test 2>/dev/null || echo "arch-test not found"
          echo "=== binfmt_misc ===" && ls -la /proc/sys/fs/binfmt_misc/ 2>/dev/null || echo "binfmt_misc not accessible"
          echo "=== binfmt descriptors ===" && ls -la /usr/share/binfmts/qemu-* 2>/dev/null || echo "no descriptors"
          arch-test aarch64 2>/dev/null && echo "aarch64: OK" || echo "aarch64: not supported (expected on GitHub Actions)"

      - name: Build image
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env \
            ./compile.sh build \
              ALLOW_ROOT=yes \
              BOARD=onecloud \
              BRANCH=current \
              RELEASE=${{ matrix.RELEASE }} \
              BUILD_MINIMAL=yes \
              BUILD_DESKTOP=no \
              KERNEL_CONFIGURE=no \
              EXPERT=yes \
              USE_CCACHE=no \
              COMPRESS_OUTPUTIMAGE=img
          sudo chown $(id -u):$(id -g) -R output/

      - name: Install dependencies
        run: |
          sudo apt install -y img2simg
          ver="v0.3.1"
          curl -L -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x ./AmlImg

      - name: Download u-boot
        run: |
          curl -L -o ./uboot.img https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}
          ./AmlImg unpack ./uboot.img burn/

      - name: Create burn image
        run: |
          diskimg=$(ls output/images/*.img)
          loop=$(sudo losetup --find --show --partscan $diskimg)
          sudo img2simg ${loop}p1 burn/boot.simg
          sudo img2simg ${loop}p2 burn/rootfs.simg
          sudo losetup -d $loop
          sudo chown $(id -u):$(id -g) -R burn/

          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" >burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" >burn/rootfs.VERIFY

          cat <<EOF >>burn/commands.txt
          PARTITION:boot:sparse:boot.simg
          VERIFY:boot:normal:boot.VERIFY
          PARTITION:rootfs:sparse:rootfs.simg
          VERIFY:rootfs:normal:rootfs.VERIFY
          EOF

          prefix=$(ls output/images/*.img | sed 's/\.img$//')
          burnimg=${prefix}.burn.img
          ./AmlImg pack $burnimg burn/

      - name: Hash and compress
        run: |
          for f in output/images/*.img; do
            sha256sum "$f" | tee -a sha256sum
            xz --threads=0 --compress "$f"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.RELEASE }}-burn-img
          path: |
            output/images/*
            sha256sum

      - name: Generate release information
        run: |
          cat <<EOF | sed -E 's/^  //' | tee Release.md
            $(cat sha256sum | awk '{printf "%s: \`%s\`\n", $2, $1}')
          EOF

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          append_body: true
          body_path: Release.md
          files: |
            output/images/*
